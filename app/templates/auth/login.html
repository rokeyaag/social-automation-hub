{% extends "base.html" %}

{% block title %}Sign In - SocialPulse{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex flex-col justify-center items-center px-4">
    <div class="w-full max-w-sm bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex w-12 h-12 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 items-center justify-center text-white text-xl font-bold shadow-md shadow-brand-500/20 mb-3">
                ⚡
            </div>
            <h2 class="text-xl font-bold text-slate-900">Welcome Back</h2>
            <p class="text-xs text-slate-500 mt-1">Sign in to manage your social media automation</p>
        </div>

        <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-4">
            <div id="errorMessage" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600 font-medium"></div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com"
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1.5">Password</label>
                <input type="password" id="password" required placeholder="••••••••"
                    class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-2.5 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold shadow-md shadow-brand-500/25 transition-all active:scale-[0.98]">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
            Don't have an account yet? 
            <a href="/register" class="font-semibold text-brand-600 hover:text-brand-700">Create one</a>
        </div>
    </div>
</div>

<script>
async function submitLogin(e) {
    e.preventDefault();
    const errBox = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');
    errBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.innerText = "Signing in...";

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/dashboard';
        } else {
            errBox.innerText = data.detail || 'Login failed.';
            errBox.classList.remove('hidden');
            submitBtn.disabled = false;
            submitBtn.innerText = "Sign In";
        }
    } catch (err) {
        errBox.innerText = 'Network error. Please try again.';
        errBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerText = "Sign In";
    }
}
</script>
{% endblock %}
