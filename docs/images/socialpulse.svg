<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18" />
      <stop offset="40%" stop-color="#0e132c" />
      <stop offset="80%" stop-color="#190e38" />
      <stop offset="100%" stop-color="#060916" />
    </linearGradient>

    <!-- Indigo/Purple Center Glow -->
    <radialGradient id="indigoCenterGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.42" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#0e132c" stop-opacity="0" />
    </radialGradient>

    <!-- Facebook Blue Accent Glow -->
    <radialGradient id="fbBlueGlow" cx="82%" cy="22%" r="42%">
      <stop offset="0%" stop-color="#1877f2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0e132c" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Ambient Corner Glow -->
    <radialGradient id="cyanAmbientGlow" cx="18%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0e132c" stop-opacity="0" />
    </radialGradient>

    <!-- Icon Gradients -->
    <linearGradient id="iconPulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="wandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titlePulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#93c5fd" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="80%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Futuristic Background -->
  <rect width="800" height="480" fill="url(#bgGrad)" />
  <rect width="800" height="480" fill="url(#indigoCenterGlow)" />
  <rect width="800" height="480" fill="url(#fbBlueGlow)" />
  <rect width="800" height="480" fill="url(#cyanAmbientGlow)" />

  <!-- Subtle High-Tech Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.25">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Central Glassmorphic App Badge Container with 3D Glowing Social & AI Emblem -->
  <g transform="translate(400, 175)" filter="url(#cardShadow)">
    <!-- Outer Glow Dashed Ring -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="8, 6" />
    
    <!-- Squircle Icon Box -->
    <rect x="-70" y="-70" width="140" height="140" rx="36" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="3" stroke-opacity="0.9" />
    <rect x="-68" y="-68" width="136" height="136" rx="34" fill="#0f172a" fill-opacity="0.75" />

    <!-- 3D Glowing Social Media Hub & AI Magic Studio Emblem -->
    <g transform="translate(0, -2)" filter="url(#glowFilter)">
      <!-- Outer Social Network Connecting Ring -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="rgba(99, 102, 241, 0.4)" stroke-width="2" />
      
      <!-- Social Node Orbs -->
      <!-- Top Node: Facebook / Share -->
      <circle cx="0" cy="-44" r="9" fill="#1877f2" stroke="#ffffff" stroke-width="1.5" />
      <text x="0" y="-40" font-family="'Inter', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">f</text>

      <!-- Bottom-Right Node: LinkedIn / Network -->
      <circle cx="38" cy="22" r="9" fill="#0a66c2" stroke="#ffffff" stroke-width="1.5" />
      <text x="38" y="26" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">in</text>

      <!-- Bottom-Left Node: AI Studio Wand / Camera -->
      <circle cx="-38" cy="22" r="9" fill="#9333ea" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="-38" cy="22" r="4" fill="#f43f5e" />

      <!-- Center Hexagonal Core Platform -->
      <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#iconPulseGrad)" stroke="#a5b4fc" stroke-width="1.8" />
      
      <!-- Electric Energy Bolt in Core -->
      <path d="M 3 -18 L -10 1 L 0 1 L -3 18 L 10 -1 L 0 -1 Z" fill="url(#boltGrad)" stroke="#ffffff" stroke-width="0.8" />

      <!-- Sparkling Stars / AI Cutout Nodes -->
      <circle cx="28" cy="-24" r="2.5" fill="#facc15" />
      <circle cx="-28" cy="-24" r="2.5" fill="#38bdf8" />
      <circle cx="0" cy="38" r="2.5" fill="#34d399" />
    </g>
  </g>

  <!-- Top Badge: AI-POWERED SOCIAL AUTOMATION & STUDIO -->
  <g transform="translate(400, 48)">
    <rect x="-185" y="-15" width="370" height="30" rx="15" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.85" />
    <text x="0" y="5" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="11" fill="#a5b4fc" letter-spacing="2" text-anchor="middle">⚡ AI SOCIAL AUTOMATION &amp; PHOTO STUDIO</text>
  </g>

  <!-- Brand Title -->
  <g transform="translate(400, 310)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="url(#titlePulseGrad)" letter-spacing="3.5" text-anchor="middle" filter="url(#glowFilter)">SOCIALPULSE HUB</text>
  </g>

  <!-- Subtitle Tagline -->
  <g transform="translate(400, 345)">
    <text x="0" y="0" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" letter-spacing="1" text-anchor="middle">Auto-Publisher, APScheduler Daemon &amp; AI Photo Studio</text>
  </g>

  <!-- 4 Feature Pills on Bottom matching other cards -->
  <g transform="translate(400, 410)">
    <!-- Pill 1: Auto-Publisher -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#38bdf8" text-anchor="middle">🚀 Auto-Publisher</text>
    </g>
    
    <!-- Pill 2: AI BG Removal -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#c084fc" text-anchor="middle">✂️ AI BG Studio</text>
    </g>

    <!-- Pill 3: APScheduler Daemon -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#34d399" text-anchor="middle">⏰ Scheduler Daemon</text>
    </g>

    <!-- Pill 4: AES-256 Security -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
      <text x="0" y="4" font-family="Inter, sans-serif" font-weight="700" font-size="11" fill="#fbbf24" text-anchor="middle">🔒 AES-256 Fernet</text>
    </g>
  </g>
</svg>
